<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge layout, 360 dp</title>
<style>
@font-face {
  font-family: Jakarta;
  src: url('../../node_modules/@expo-google-fonts/plus-jakarta-sans/700Bold/PlusJakartaSans_700Bold.ttf');
}
* { box-sizing: border-box; }
body { margin: 0; width: 360px; background: #FBF8F3; color: #1F2A2E; font-family: Jakarta, sans-serif; }
.screen { padding: 16px; }
.card { background: #fff; border-radius: 24px; padding: 16px; margin-bottom: 12px; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.code { flex: 1; min-width: 0; font-size: 14px; }
.badge {
  display: flex; align-items: center; gap: 4px; align-self: flex-start; flex-shrink: 1;
  max-width: 100%; border-radius: 999px; border: 1px solid #F6D48D;
  padding: 2px 8px; background: #FFF1D6; color: #5C3B00;
}
.dot { flex: none; width: 7px; height: 7px; border-radius: 999px; background: #5C3B00; }
.label { flex-shrink: 1; min-width: 0; font-size: 10px; line-height: 15px; font-weight: 700; }
.measure { font: 11px sans-serif; margin-top: 8px; color: #5F6B70; }
</style>
<div class="screen">
  <div class="card"><div class="top"><div class="code">REF-20261024-0009</div><div class="badge"><div class="dot"></div><div class="label">MENUNGGU APPROVAL FINANCE</div></div></div><div class="measure"></div></div>
  <div class="card"><div class="top"><div class="code">REF-20261024-0010</div><div class="badge"><div class="dot"></div><div class="label">DISETUJUI FINANCE</div></div></div><div class="measure"></div></div>
  <div class="card"><div class="top"><div class="code">REF-20261024-0011</div><div class="badge"><div class="dot"></div><div class="label">SEDANG DISIAPKAN</div></div></div><div class="measure"></div></div>
</div>
<script>
document.fonts.ready.then(() => {
  for (const card of document.querySelectorAll('.card')) {
    const label = card.querySelector('.label');
    const badge = card.querySelector('.badge');
    const bounds = label.getBoundingClientRect();
    const clipped = label.scrollWidth > label.clientWidth || label.scrollHeight > label.clientHeight;
    const outside = badge.getBoundingClientRect().right > card.getBoundingClientRect().right;
    card.querySelector('.measure').textContent =
      `${bounds.width.toFixed(1)} × ${bounds.height.toFixed(1)} px · ${clipped || outside ? 'CLIPPED' : 'FULL LABEL'}`;
    card.dataset.layout = clipped || outside ? 'fail' : 'pass';
  }
});
</script>
</html>
